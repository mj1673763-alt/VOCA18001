<title>VOCA 1800 단어 학습</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#f5f6fa;--card:#fff;--tx:#1d2233;--sub:#6b7185;--pri:#3b5bdb;--pri-t:#fff;--ok:#2f9e44;--no:#e03131;--bd:#dfe3ee;--inv:none;--blend:multiply}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12141b;--card:#1c2030;--tx:#eceef6;--sub:#9aa1b8;--pri:#748ffc;--pri-t:#10131f;--ok:#51cf66;--no:#ff6b6b;--bd:#2d3350;--inv:invert(1);--blend:screen;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#12141b;--card:#1c2030;--tx:#eceef6;--sub:#9aa1b8;--pri:#748ffc;--pri-t:#10131f;--ok:#51cf66;--no:#ff6b6b;--bd:#2d3350;--inv:invert(1);--blend:screen;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--tx);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;line-height:1.4}
#app{max-width:560px;margin:0 auto;padding:14px 14px 40px}
h1{font-size:20px;margin:6px 0 2px}
.sub{color:var(--sub);font-size:13px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:14px;margin:12px 0}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.between{justify-content:space-between}
button{font:inherit;color:var(--tx);background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:10px 14px;cursor:pointer}
button.pri{background:var(--pri);color:var(--pri-t);border-color:var(--pri);font-weight:700}
button.sm{padding:6px 10px;font-size:13px;border-radius:10px}
button.on{background:var(--pri);color:var(--pri-t);border-color:var(--pri)}
button:disabled{opacity:.4}
.grid{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin-top:10px}
.day{padding:9px 0;text-align:center;font-size:14px;position:relative;border-radius:10px}
.day i{position:absolute;top:2px;right:4px;width:7px;height:7px;border-radius:50%;background:var(--no)}
.seg{display:flex;gap:6px;flex:1}.seg button{flex:1}
.big{font-size:34px;font-weight:700;text-align:center;word-break:break-word}
.stage{min-height:230px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;user-select:none}
.mean{max-width:100%;height:auto;filter:var(--inv);mix-blend-mode:var(--blend);transform-origin:center}
.bar{height:6px;background:var(--bd);border-radius:4px;overflow:hidden}.bar b{display:block;height:100%;background:var(--pri)}
input[type=text]{width:100%;font:inherit;font-size:20px;padding:12px;border-radius:12px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);text-align:center}
.ok{color:var(--ok)}.no{color:var(--no)}
.wl{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--bd)}.wl:first-child{border-top:0}
.wl b{min-width:110px}
.tag{font-size:12px;color:var(--sub)}
label.chk{display:flex;align-items:center;gap:6px;font-size:14px}
.kor{font-size:21px;font-weight:600;line-height:1.5;word-break:keep-all}
i.pos{font-style:italic;color:var(--sub);margin-right:2px;font-weight:400}
.dot{position:absolute;top:2px;right:4px;width:7px;height:7px;border-radius:50%;background:var(--no)}
.seg2{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.opt{display:block;width:100%;text-align:left;margin-bottom:8px;padding:13px 14px;font-size:16px;line-height:1.45}
.wl{flex-wrap:wrap}.wl b{min-width:90px}
</style>
</head>

function saveWrong(){try{localStorage.setItem('voca_wrong',JSON.stringify([...wrong]))}catch(e){}}
let cfg={days:new Set([1]),mode:'card',dir:'en',shuffle:true,only:false,n:30};
try{const c=JSON.parse(localStorage.getItem('voca_cfg2')||'null');if(c){cfg={...cfg,...c,days:new Set(c.days)}}}catch(e){}
function saveCfg(){try{localStorage.setItem('voca_cfg2',JSON.stringify({...cfg,days:[...cfg.days]}))}catch(e){}}
let S=null;
const shuf=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
function speak(t){try{const u=new SpeechSynthesisUtterance(t);u.lang='en-US';u.rate=.9;speechSynthesis.cancel();speechSynthesis.speak(u)}catch(e){}}
function pool(){let p=W.filter(w=>cfg.days.has(w.day));if(cfg.only)p=p.filter(w=>wrong.has(w.id));return p}
const norm=s=>(s||'').trim().toLowerCase().replace(/\s+/g,' ');
const sq=s=>(s||'').replace(/\s+/g,'');
const fuzzy=(a,w)=>sq(a).length>=2&&sq(w.ko).includes(sq(a));
const isEn=()=>cfg.dir=='en';
const qHTML=w=>isEn()?`<div class="big">${w.en}</div><button class="sm" id="spk">🔊 발음</button>`:`<div class="kor">${fmt(w.ko)}</div>`;
const aHTML=w=>isEn()?`<div class="kor">${fmt(w.ko)}</div>`:`<div class="big">${w.en}</div><button class="sm" id="spk">🔊 발음</button>`;
function rec(w,ok){if(ok){S.ok++;wrong.delete(w.id)}else{S.miss.push(w);wrong.add(w.id)}saveWrong()}
function bindSpk(w){const s=$('#spk');if(s)s.onclick=e=>{e.stopPropagation();speak(w.en)}}

function home(){
  S=null;
  const wd={};wrong.forEach(id=>{const d=id/100|0;wd[d]=(wd[d]||0)+1});
  const p=pool();
  let g='';for(let d=1;d<=60;d++)g+=`<button class="day ${cfg.days.has(d)?'on':''}" data-d="${d}">${d}${wd[d]?'<i class="dot"></i>':''}</button>`;
  const M=[['card','플래시카드'],['mc','4지선다'],['type','직접 입력'],['exam','시험지']];
  $('#app').innerHTML=`
  <h1>VOCA 1800</h1><div class="sub">DAY 01–60 · 총 1800단어 · 선택한 DAY: ${cfg.days.size}개</div>
  <div class="card">
    <div class="row between"><b>DAY 선택</b><span class="row"><button class="sm" id="all">전체</button><button class="sm" id="none">해제</button></span></div>
    <div class="row" style="margin-top:8px">${[0,1,2,3,4,5].map(k=>`<button class="sm" data-r="${k}">${k*10+1}–${k*10+10}</button>`).join('')}</div>
    <div class="grid">${g}</div>
    <div class="tag" style="margin-top:8px">탭하면 여러 DAY를 자유롭게 선택/해제할 수 있어요. 빨간 점은 오답이 남은 DAY.</div>
  </div>
  <div class="card">
    <b>학습 방식</b>
    <div class="seg2" style="margin-top:8px">${M.map(m=>`<button data-m="${m[0]}" class="${cfg.mode==m[0]?'on':''}">${m[1]}</button>`).join('')}</div>
    <div class="row" style="margin-top:12px"><b style="font-size:14px">출제 방향</b><div class="seg">
      <button data-dir="en" class="${cfg.dir=='en'?'on':''}">영어 → 뜻</button>
      <button data-dir="ko" class="${cfg.dir=='ko'?'on':''}">뜻 → 영어</button></div></div>
    ${cfg.mode=='exam'?`<div class="row" style="margin-top:10px"><span class="sub">문제 수</span><div class="seg">${[10,30,50,100].map(n=>`<button data-n="${n}" class="sm ${cfg.n==n?'on':''}">${n}</button>`).join('')}</div></div>`:''}
    <div class="tag" style="margin-top:8px">${cfg.mode=='type'||cfg.mode=='exam'?(isEn()?'뜻의 일부(2글자 이상)만 써도 자동 인정돼요. 채점 후 직접 정답/오답으로 바꿀 수 있어요.':'영어 철자를 정확히 입력해야 정답이에요.'):''}</div>
    <div class="row" style="margin-top:10px;gap:18px">
      <label class="chk"><input type="checkbox" id="sh" ${cfg.shuffle?'checked':''}>섞기</label>
      <label class="chk"><input type="checkbox" id="only" ${cfg.only?'checked':''}>오답만 (${wrong.size})</label></div>
  </div>
  <button class="pri" id="go" style="width:100%;padding:14px;font-size:17px" ${p.length?'':'disabled'}>시작하기 (${cfg.mode=='exam'?Math.min(cfg.n,p.length):p.length}단어)</button>
  ${wrong.size?'<div style="text-align:center;margin-top:10px"><button class="sm" id="clr">오답 기록 지우기</button></div>':''}`;
  document.querySelectorAll('.day').forEach(b=>b.onclick=()=>{const d=+b.dataset.d;cfg.days.has(d)?cfg.days.delete(d):cfg.days.add(d);saveCfg();home()});
  document.querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>{const k=+b.dataset.r;const r=[...Array(10)].map((_,i)=>k*10+i+1);const all=r.every(d=>cfg.days.has(d));r.forEach(d=>all?cfg.days.delete(d):cfg.days.add(d));saveCfg();home()});
  $('#all').onclick=()=>{cfg.days=new Set([...Array(60)].map((_,i)=>i+1));saveCfg();home()};
  $('#none').onclick=()=>{cfg.days=new Set();saveCfg();home()};
  document.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{cfg.mode=b.dataset.m;saveCfg();home()});
  document.querySelectorAll('[data-dir]').forEach(b=>b.onclick=()=>{cfg.dir=b.dataset.dir;saveCfg();home()});
  document.querySelectorAll('[data-n]').forEach(b=>b.onclick=()=>{cfg.n=+b.dataset.n;saveCfg();home()});
  $('#sh').onchange=e=>{cfg.shuffle=e.target.checked;saveCfg()};
  $('#only').onchange=e=>{cfg.only=e.target.checked;saveCfg();home()};
  $('#go').onclick=()=>start(pool());
  const c=$('#clr');if(c)c.onclick=()=>{if(confirm('오답 기록을 모두 지울까요?')){wrong.clear();saveWrong();home()}};
}
function start(list){
  let L=cfg.shuffle?shuf(list):list.slice();if(cfg.mode=='exam')L=L.slice(0,cfg.n||30);
  S={list:L,i:0,miss:[],ok:0,flip:false,checked:false,mc:null,ex:null,fin:false};show();
}
function head(){
  const t=S.list.length;
  return `<div class="row between"><button class="sm" id="back">← 나가기</button><span class="sub">${S.i+1} / ${t} · 맞음 ${S.ok} · 틀림 ${S.miss.length}</span></div>
  <div class="bar" style="margin:10px 0"><b style="width:${S.i/t*100}%"></b></div>`;
}
const quit=()=>{if(confirm('학습을 종료할까요?'))home()};
function show(){
  if(cfg.mode=='exam'&&!S.fin)return exam();
  if(S.i>=S.list.length)return result();
  const w=S.list[S.i];
  if(cfg.mode=='mc')return showMC(w);
  if(cfg.mode=='type')return showType(w);
  $('#app').innerHTML=head()+`<div class="card stage" id="cd" style="cursor:pointer">${S.flip?aHTML(w):qHTML(w)}
    <div class="tag">DAY ${w.day} · No.${w.n} ${S.flip?'':'· 탭해서 뒤집기'}</div></div>
    <div class="row"><div class="seg"><button id="n" class="no" ${S.flip?'':'disabled'}>✗ 몰라요</button><button id="y" class="ok" ${S.flip?'':'disabled'}>✓ 알아요</button></div></div>`;
  $('#back').onclick=quit;bindSpk(w);
  $('#cd').onclick=()=>{if(!S.flip){S.flip=true;show();if(!isEn())speak(w.en)}};
  if(S.flip){$('#y').onclick=()=>{rec(w,true);S.i++;S.flip=false;show()};$('#n').onclick=()=>{rec(w,false);S.i++;S.flip=false;show()}}
}
function showMC(w){
  if(!S.mc||S.mc.id!==w.id){
    const base=pool().length>=4?pool():W;let o=[w];const seen=new Set([w.id,w.ko,w.en]);
    for(const x of shuf(base)){if(o.length>=4)break;const lab=isEn()?x.ko:x.en;if(!seen.has(x.id)&&!seen.has(lab)){seen.add(x.id);seen.add(lab);o.push(x)}}
    S.mc={id:w.id,o:shuf(o),sel:null};
  }
  const m=S.mc;
  $('#app').innerHTML=head()+`<div class="card stage" style="min-height:140px">${qHTML(w)}<div class="tag">DAY ${w.day} · No.${w.n}</div></div>`
  +m.o.map((x,k)=>{let st='';if(m.sel!==null){if(x.id===w.id)st='border:2px solid var(--ok);';else if(k===m.sel)st='border:2px solid var(--no);'}
    return `<button class="opt" data-k="${k}" style="${st}">${isEn()?fmt(x.ko):'<b>'+x.en+'</b>'}</button>`}).join('')
  +(m.sel!==null?'<button class="pri" id="nx" style="width:100%;padding:12px">다음 →</button>':'');
  $('#back').onclick=quit;bindSpk(w);
  if(m.sel===null){if(isEn())speak(w.en);document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
    const k=+b.dataset.k;m.sel=k;rec(w,m.o[k].id===w.id);if(!isEn())speak(w.en);showMC(w)})}
  else $('#nx').onclick=()=>{S.i++;S.mc=null;show()};
}
function showType(w){
  const fb=S.checked?S.fb:'';
  $('#app').innerHTML=head()+`<div class="card stage">${qHTML(w)}<div class="tag">DAY ${w.day} · No.${w.n}</div>
    <input type="text" id="ans" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="${isEn()?'뜻을 입력 (일부만 써도 돼요)':'영어 단어 입력'}" ${S.checked?'disabled':''}>
    <div id="fb" style="min-height:28px;font-weight:700">${fb}</div></div>
    <div class="row"><div class="seg">${S.checked?`${S.lastOk?'':'<button id="force">정답으로 처리</button>'}<button class="pri" id="nx">다음 →</button>`:'<button id="idk">모르겠어요</button><button class="pri" id="chk">확인</button>'}</div></div>`;
  $('#back').onclick=quit;bindSpk(w);
  const inp=$('#ans');
  if(!S.checked){inp.focus();inp.onkeydown=e=>{if(e.key=='Enter')typeCheck(w,inp.value)};$('#chk').onclick=()=>typeCheck(w,inp.value);$('#idk').onclick=()=>typeCheck(w,null)}
  else{inp.value=S.last||'';$('#nx').onclick=()=>{S.i++;S.checked=false;show()};
    const f=$('#force');if(f)f.onclick=()=>{S.miss.pop();S.ok++;wrong.delete(w.id);saveWrong();S.lastOk=true;S.fb=`<span class="ok">정답 처리됨</span><div class="kor" style="margin-top:6px">${isEn()?fmt(w.ko):w.en}</div>`;showType(w)}}
}
function typeCheck(w,v){
  const ok=v!==null&&(isEn()?fuzzy(v,w):norm(v)===norm(w.en));
  S.last=v||'';S.checked=true;S.lastOk=ok;rec(w,ok);
  S.fb=`<span class="${ok?'ok':'no'}">${ok?'정답!':'오답'}</span><div class="kor" style="margin-top:6px">${isEn()?fmt(w.ko):w.en}</div>`;
  speak(w.en);showType(w);
}
function exam(){
  const L=S.list;if(!S.ex)S.ex={a:[],rev:false,m:[]};const E=S.ex;
  const ans=w=>isEn()?fmt(w.ko):'<b>'+w.en+'</b>';
  if(!E.rev){
    $('#app').innerHTML=`<div class="row between"><button class="sm" id="back">← 나가기</button><span class="sub">시험지 · ${L.length}문제</span></div>`
    +L.map((w,i)=>`<div class="card"><div class="tag">${i+1}번 · DAY ${w.day}</div><div style="margin:8px 0 10px">${isEn()?`<div class="big" style="text-align:left;font-size:26px">${w.en}</div>`:`<div class="kor" style="font-size:19px">${fmt(w.ko)}</div>`}</div><input type="text" data-i="${i}" value="${(E.a[i]||'').replace(/"/g,'&quot;')}" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="${isEn()?'뜻을 입력':'영어 단어'}"></div>`).join('')
    +'<button class="pri" id="sub" style="width:100%;padding:14px;font-size:17px">제출하고 채점하기</button>';
    $('#back').onclick=()=>{if(confirm('시험을 종료할까요?'))home()};
    document.querySelectorAll('input[data-i]').forEach(inp=>inp.oninput=()=>{E.a[+inp.dataset.i]=inp.value});
    $('#sub').onclick=()=>{E.m=L.map((w,i)=>isEn()?fuzzy(E.a[i],w):norm(E.a[i])===norm(w.en));E.rev=true;window.scrollTo(0,0);exam()};
  }else{
    const c=E.m.filter(Boolean).length;
    $('#app').innerHTML=`<h1>채점 결과: ${c} / ${L.length}</h1><div class="sub">${isEn()?'뜻은 표현이 다양해서 일부만 맞아도 인정돼요. ':''}잘못 채점된 문제는 오른쪽 버튼으로 직접 바꿀 수 있어요.</div>`
    +L.map((w,i)=>`<div class="card" style="padding:10px 14px"><div class="row between"><b class="${E.m[i]?'ok':'no'}">${i+1}. ${E.m[i]?'✓ 정답':'✗ 오답'}</b><button class="sm" data-t="${i}">${E.m[i]?'오답으로':'정답으로'}</button></div>
      <div style="margin:6px 0"><b>${w.en}</b></div><div class="kor" style="font-size:16px;font-weight:500">${fmt(w.ko)}</div>
      <div class="tag" style="margin-top:4px">내 답: <span class="${E.m[i]?'ok':'no'}">${E.a[i]||'(없음)'}</span></div></div>`).join('')
    +'<button class="pri" id="fin" style="width:100%;padding:14px;font-size:17px">채점 완료</button>';
    document.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{const y=window.scrollY;E.m[+b.dataset.t]=!E.m[+b.dataset.t];exam();window.scrollTo(0,y)});
    $('#fin').onclick=()=>{S.ok=0;S.miss=[];L.forEach((w,i)=>{if(E.m[i]){S.ok++;wrong.delete(w.id)}else{S.miss.push(w);wrong.add(w.id)}});saveWrong();S.fin=true;S.i=L.length;window.scrollTo(0,0);result()};
  }
}
function result(){
  const t=S.list.length,m=S.miss;
  $('#app').innerHTML=`<h1>학습 완료 🎉</h1>
  <div class="card" style="text-align:center"><div class="big">${S.ok} / ${t}</div><div class="sub">정답률 ${Math.round(S.ok/t*100)}%</div></div>
  ${m.length?`<div class="card"><b class="no">틀린 단어 ${m.length}개</b>${m.map(w=>`<div class="wl"><b>${w.en}</b><span class="kor" style="font-size:14px;font-weight:500">${fmt(w.ko)}</span><span class="tag" style="margin-left:auto">D${w.day}</span></div>`).join('')}</div>`:''}
  <div class="row">${m.length?'<button class="pri" id="rw" style="flex:1">틀린 것만 다시</button>':''}<button id="hm" style="flex:1">처음으로</button></div>`;
  const r=$('#rw');if(r)r.onclick=()=>start(m);
  $('#hm').onclick=home;
}
home();
</script>
</body>
</html>
